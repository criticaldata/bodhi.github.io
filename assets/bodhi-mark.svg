  <!-- side veins -->
  <path d="M60 38 C51 40 42 44 34 51" stroke="#eafff2" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
  <path d="M60 38 C69 40 78 44 86 51" stroke="#eafff2" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
  <path d="M60 56 C53 59 46 64 40 70" stroke="#eafff2" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
  <path d="M60 56 C67 59 74 64 80 70" stroke="#eafff2" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
  <path d="M60 74 C56 77 52 81 49 85" stroke="#eafff2" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
  <path d="M60 74 C64 77 68 81 71 85" stroke="#eafff2" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
</svg>
