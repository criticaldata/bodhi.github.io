<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="leafFill" x1="60" y1="10" x2="60" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fa86b"/>
      <stop offset="0.55" stop-color="#16804a"/>
      <stop offset="1" stop-color="#0d5f43"/>
    </linearGradient>
  </defs>
  <!-- stem -->
  <path d="M60 4 C60 8 60 12 60 17" stroke="#b44230" stroke-width="4.5" stroke-linecap="round"/>
