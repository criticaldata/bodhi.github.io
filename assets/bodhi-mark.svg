<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ensoStroke" x1="14" y1="90" x2="100" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#3d4f6e"/>
    </linearGradient>
    <linearGradient id="leafFill" x1="78" y1="54" x2="104" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16804a"/>
      <stop offset="1" stop-color="#2fa86b"/>
    </linearGradient>
  </defs>
  <!-- enso: open brush circle, gap at upper right -->
  <path d="M 86 25
           A 43 43 0 1 0 102 50"
        stroke="url(#ensoStroke)" stroke-width="9" stroke-linecap="round"/>
  <!-- leaf sprouting through the enso opening -->
  <path d="M 82 56
           C 76 40, 84 22, 100 12
           C 106 28, 100 46, 84 56
           C 83 56.2, 82.5 56.2, 82 56 Z"
        fill="url(#leafFill)"/>
  <!-- leaf midrib -->
  <path d="M 84 54 C 88 42, 93 28, 99 15" stroke="#eafff2" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- terracotta seed dot at the brush start, the point of inquiry -->
  <circle cx="102" cy="50" r="5.5" fill="#b44230"/>
</svg>
